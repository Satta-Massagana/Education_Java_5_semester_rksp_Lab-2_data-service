openapi: 3.0.3
info:
  title: UserEvent Reader API
  version: 1.0.0

paths:
  /events:
    get:
      operationId: getAllUserEvents
      responses:
        '200':
          description: Список всех событий пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserEvent'
        '404':
          description: События не найдены
        default:
          description: Ошибка сервера
components:
  schemas:
    UserEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
        eventTime:
          type: string
          format: date-time
